name: Build macOS Launcher

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt bullet lua

      - name: Build VNLauncher
        run: |
          cmake -B build-mac -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build-mac --target VNLauncher -j$(sysctl -n hw.ncpu)

      - name: Package .app bundle
        run: |
          APP=VNLauncher.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build-mac/VNLauncher "$APP/Contents/MacOS/VNLauncher"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>VNLauncher</string>
            <key>CFBundleIdentifier</key><string>com.physicsengine3d.vnlauncher</string>
            <key>CFBundleName</key><string>NovaEngine3D Launcher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
          </dict></plist>
          PLIST
          $(brew --prefix qt)/bin/macdeployqt "$APP" || true
          zip -ry NovaEngine3D-Launcher-macOS.zip "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaEngine3D-Launcher-macOS
          path: NovaEngine3D-Launcher-macOS.zip
